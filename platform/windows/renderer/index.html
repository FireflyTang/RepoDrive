<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self';script-src 'self'"><title>RepoDrive ReadOnly</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="shell"><aside><div class="brand"><b>R</b><span><strong>RepoDrive</strong><small>Windows 只读版</small></span></div><button id="filesNav" class="nav active">▦ 文件</button><button id="settingsNav" class="nav">⚙ 连接设置</button><div class="repo"><i id="dot"></i><span><small>当前代码仓</small><strong id="repoLabel">尚未连接</strong></span></div></aside>
<main><section id="filesView"><header><div><h1>文件</h1><div id="breadcrumbs"></div></div><button id="refresh" class="button" disabled>↻ 刷新</button></header><div class="readonly">只读客户端 · 仅可浏览和下载</div><div id="progress" class="progress hidden">正在下载 <span id="progressPath"></span></div><div class="card"><div class="head"><span>名称</span><span>大小</span><span>操作</span></div><div id="list"></div><div id="empty" class="empty"><b>☁</b><h2>连接 GitHub 代码仓</h2><p>设置后即可浏览并下载文件或整个目录。</p><button id="setup" class="primary">开始设置</button></div></div></section>
<section id="settingsView" class="hidden"><header><div><h1>连接设置</h1><p>此版本不会修改代码仓内容</p></div></header><form id="form" class="form"><label>代码仓<input id="repository" required placeholder="owner/repository"></label><div class="row"><label>分支<input id="branch" required value="main"></label><label>根目录（可选）<input id="rootPath" placeholder="shared/files"></label></div><label>只读 Token（公开仓可留空）<input id="token" type="password" autocomplete="off" placeholder="github_pat_…"><small>检测到可写权限时会拒绝连接。</small></label><label>HTTP/HTTPS 代理（可选）<input id="proxy" placeholder="http://127.0.0.1:7890"></label><label id="clearRow" class="check hidden"><input id="clearToken" type="checkbox">清除已保存的 Token</label><div class="submit"><span id="status"></span><button class="primary">保存并测试连接</button></div></form></section></main></div><div id="toast" class="toast"></div><script src="app.js"></script></body></html>
